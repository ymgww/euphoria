<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="styles.css" />

<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-name">Euphoria</div>
      </div>
      <nav class="site-nav">

  <main>

      <div class="container">
        <h2>商品情報</h2>
        <div class="cards">
          <article class="card product-card">
            <a href="https://play.google.com/store/apps/details?id=com.euphoria.BreakingBlock&hl=ja" target="_blank" rel="noopener noreferrer">

        <div class="about-grid">

            <p>山際章夫</p>
          </div>
          <div>

            <p>大阪府守口市金田町3-44-27</p>
          </div>
        </div>
      </div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 合同会社Euphoria</p>
    </div>
  </footer>
